name: 16 Acoustic Math 1080p Video Masterclass Engine

on:
  workflow_dispatch:
    inputs:
      render_mode:
        description: 'Rendering Mode (test = 2 equations, full = 10 equations ~10 min)'
        required: true
        default: 'test'
        type: choice
        options:
          - 'test'
          - 'full'
      fps:
        description: 'Frames per second (24 = fast render, 30 = ultra smooth)'
        required: true
        default: '24'
        type: choice
        options:
          - '24'
          - '30'
      upload_to_youtube:
        description: 'Upload directly to YouTube via Data API v3'
        required: true
        default: true
        type: boolean
      privacy_status:
        description: 'YouTube Privacy Status (public, unlisted, private)'
        required: true
        default: 'public'
        type: choice
        options:
          - 'public'
          - 'unlisted'
          - 'private'

permissions:
  contents: write

jobs:
  render-acoustic-masterclass:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install System FFmpeg & Audio Codecs
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Headless Acoustic Mathematics Video Renderer
        run: |
          echo "[+] Starting 1080p Masterclass Rendering (Mode: ${{ github.event.inputs.render_mode }}, FPS: ${{ github.event.inputs.fps }})..."
          python scripts/render_acoustic_math_masterclass.py --mode ${{ github.event.inputs.render_mode }} --fps ${{ github.event.inputs.fps }}

      - name: Upload Masterclass MP4 as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Acoustic_Math_Masterclass_${{ github.event.inputs.render_mode }}
          path: output/*.mp4
          retention-days: 14

      - name: Publish to YouTube with 100% SEO Metadata
        if: ${{ github.event.inputs.upload_to_youtube == 'true' || github.event.inputs.upload_to_youtube == true }}
        env:
          YOUTUBE_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          echo "[+] Publishing 1080p Masterclass to YouTube with 100% SEO Meta (Privacy: ${{ github.event.inputs.privacy_status }})..."
          python scripts/upload_acoustic_math_to_youtube.py ${{ github.event.inputs.privacy_status }}

      - name: Commit Upload Receipts
        if: ${{ github.event.inputs.upload_to_youtube == 'true' || github.event.inputs.upload_to_youtube == true }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --staged --quiet || (git commit -m "chore(receipt): update YouTube masterclass publication receipt [skip ci]" && git push origin main)
