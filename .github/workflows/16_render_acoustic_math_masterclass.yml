name: 16 Acoustic Math 1080p Video Masterclass Engine

on:
  schedule:
    # Daily automated schedule at 14:00 UTC (10:00 AM EST / 3:00 PM GMT / 7:30 PM IST - Peak Long-Form Publishing Window)
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      render_mode:
        description: 'Rendering Mode (full = 10 equations ~8.5 min, test = 2 equations ~1.7 min)'
        required: true
        default: 'full'
        type: choice
        options:
          - 'full'
          - 'test'
      fps:
        description: 'Frames per second (24 = fast render, 30 = ultra smooth)'
        required: true
        default: '24'
        type: choice
        options:
          - '24'
          - '30'
      upload_to_youtube:
        description: 'Upload directly to YouTube via Data API v3'
        required: true
        default: true
        type: boolean
      privacy_status:
        description: 'YouTube Privacy Status (public, unlisted, private)'
        required: true
        default: 'public'
        type: choice
        options:
          - 'public'
          - 'unlisted'
          - 'private'

permissions:
  contents: write

jobs:
  render-acoustic-masterclass:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Fast Static FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: 'release'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Headless Acoustic Mathematics Video Renderer
        run: |
          RENDER_MODE="${{ github.event.inputs.render_mode || 'full' }}"
          RENDER_FPS="${{ github.event.inputs.fps || '24' }}"
          echo "[+] Starting 1080p Masterclass Rendering (Mode: $RENDER_MODE, FPS: $RENDER_FPS)..."
          python scripts/render_acoustic_math_masterclass.py --mode "$RENDER_MODE" --fps "$RENDER_FPS"

      - name: Upload Masterclass MP4 as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Acoustic_Math_Masterclass_Output
          path: output/*.mp4
          retention-days: 14

      - name: Publish to YouTube with 100% SEO Metadata
        if: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_youtube == 'true' || github.event.inputs.upload_to_youtube == true }}
        env:
          YOUTUBE_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          PRIVACY="${{ github.event.inputs.privacy_status || 'public' }}"
          echo "[+] Publishing 1080p Masterclass to YouTube with 100% SEO Meta (Privacy: $PRIVACY)..."
          python scripts/upload_acoustic_math_to_youtube.py "$PRIVACY"

      - name: Commit Upload Receipts
        if: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_youtube == 'true' || github.event.inputs.upload_to_youtube == true }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --staged --quiet || (git commit -m "chore(receipt): update YouTube masterclass publication receipt [skip ci]" && git pull --rebase origin main && git push origin main)
