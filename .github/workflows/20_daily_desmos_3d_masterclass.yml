name: 20 Daily Desmos 3D Masterclass Engine

on:
  schedule:
    # Daily automated schedule at 14:00 UTC (10:00 AM EST / 3:00 PM GMT / 7:30 PM IST - Prime Long-Form STEM Window)
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      episode:
        description: 'Episode number to render from 100-catalog (1-100, default: 1)'
        required: false
        default: '1'
      upload_to_youtube:
        description: 'Upload directly to YouTube via Data API v3'
        required: true
        default: true
        type: boolean
      privacy_status:
        description: 'YouTube Privacy Status (public, unlisted, private)'
        required: true
        default: 'public'
        type: choice
        options:
          - 'public'
          - 'unlisted'
          - 'private'

permissions:
  contents: write

jobs:
  render-and-upload-desmos-3d:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Fast Static FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: 'release'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render 1080p Desmos 3D Masterclass Video
        run: |
          EP="${{ github.event.inputs.episode || 1 }}"
          echo "[+] Rendering Desmos 3D Masterclass Episode $EP..."
          python scripts/render_desmos_3d_episode.py --episode "$EP"

      - name: Upload 1080p MP4 as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Desmos_3D_Masterclass_Output
          path: output/*.mp4
          retention-days: 14

      - name: Publish to YouTube with 100% SEO Metadata
        if: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_youtube == 'true' || github.event.inputs.upload_to_youtube == true }}
        env:
          YOUTUBE_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          PRIVACY="${{ github.event.inputs.privacy_status || 'public' }}"
          echo "[+] Publishing Desmos 3D Video to YouTube (Privacy: $PRIVACY)..."
          python scripts/upload_desmos_3d_to_youtube.py "$PRIVACY"

      - name: Commit State & Receipts
        if: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_youtube == 'true' || github.event.inputs.upload_to_youtube == true }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --staged --quiet || (git commit -m "chore(receipt): update Desmos 3D publication receipt [skip ci]" && git pull --rebase origin main && git push origin main)
