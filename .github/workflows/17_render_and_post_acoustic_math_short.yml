name: 17 Acoustic Math YouTube Short & Reel Engine

on:
  schedule:
    # Daily automated schedule at 18:00 UTC (2:00 PM EST / 7:00 PM GMT / 11:30 PM IST - Peak Shorts Browsing Window)
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      upload_to_youtube:
        description: 'Upload directly to YouTube Shorts via Data API v3'
        required: true
        default: true
        type: boolean
      privacy_status:
        description: 'YouTube Privacy Status (public, unlisted, private)'
        required: true
        default: 'public'
        type: choice
        options:
          - 'public'
          - 'unlisted'
          - 'private'

permissions:
  contents: write

jobs:
  render-and-upload-short:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Fast Static FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: 'release'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Render 1080x1920 Acoustic Math Short Video
        run: |
          echo "[+] Rendering 9:16 Vertical Short Video (Acoustic Mathematics)..."
          python scripts/render_acoustic_math_short.py

      - name: Upload Short MP4 as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Acoustic_Math_Short_Output
          path: output/acoustic_math_short.mp4
          retention-days: 14

      - name: Publish to YouTube Shorts with SEO Metadata
        if: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_youtube == 'true' || github.event.inputs.upload_to_youtube == true }}
        env:
          YOUTUBE_CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          PRIVACY="${{ github.event.inputs.privacy_status || 'public' }}"
          echo "[+] Uploading 9:16 Video to YouTube Shorts (Privacy: $PRIVACY)..."
          python scripts/upload_acoustic_math_short.py "$PRIVACY"

      - name: Commit Upload Receipts
        if: ${{ github.event_name == 'schedule' || github.event.inputs.upload_to_youtube == 'true' || github.event.inputs.upload_to_youtube == true }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --staged --quiet || (git commit -m "chore(receipt): update YouTube short publication receipt [skip ci]" && git push origin main)
